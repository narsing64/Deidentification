# Fixed shortlist (approved 2026-10-12). Do not add or swap models mid-benchmark without a
# documented compatibility / licence / suitability failure (see docs/02_model_assessment.md).
#
# window_tokens / context_tokens: sliding-window inference. Each token is predicted from the window
# where it sits in the central "core" (window - 2*context), so every prediction has >= context
# tokens of left and right context except at document edges. Window sizes follow each model's
# documented TRAINING length (obi: 128 incl. 32+32 context; OpenMed: 384; Stanford: undocumented,
# so its 512 maximum is used). Context is 32 for obi (documented) and 64 otherwise.

# Experiment 7 result (docs/07_model_selection.md). Used by the pipeline / run_deidentification.py.
selected: openmed_fastclinical_82m

# Section 11 result (results/exp9_optimization/report.openmed_fastclinical_82m.md): dynamic int8 ONNX accepted
# (1.62x faster, combined strict recall -0.0011 within the pre-declared 0.002 tolerance); 8 threads gave no
# further gain. Used by the pipeline (deployment=True). Create the file with:
#   python scripts/optimize_model.py --model openmed_fastclinical_82m --configs onnx_int8:4:8
deployment:
  openmed_fastclinical_82m:
    backend: onnx
    onnx_path: .cache/onnx/openmed_fastclinical_82m/model.int8.onnx
    threads: 4
    batch_size: 8

cache_dir: null          # null = use HF_HOME / default HF cache (yours: D:\hf_cache)
torch_threads: 4         # fixed for all measurements
batch_size: 8            # windows per forward pass

